### Site metadata ###
site_name: CaDoodle CAD
site_description: Documentation for CaDoodle CAD - A simple yet powerful CAD solution
site_url: https://cadoodlecad.com/
repo_url: https://github.com/CaDoodleWebsite/cadoodlecad.github.io
edit_uri: edit/main/docs/docs/
### Build settings ###
theme: readthedocs
use_directory_urls: false  # Prevents redirects
docs_dir: docs  # Where your documentation files live
site_dir: site  # Where mkdocs will build the final site
exclude_docs: |
  .#*
  *~
  \#*\#
extra:
  favicon: favicon.ico
extra_javascript:
  - js/vendor/babylon.js
  - js/vendor/babylon.stlFileLoader.js
  - path: js/stl-viewer.mjs
    type: module
extra_css:
  - css/stl-viewer.css
nav:
  - About CaDoodle CAD: landing.md
  - Tutorial: 
    - Getting Started: tutorial/getting-started.md
    - Keyboard Shortcuts: tutorial/KeyboardShortcuts.md
  - Developer Information:
    - Adding New Example Objects: tutorial/AddNewExampleObjects.md
    - Theme Customization: tutorial/ThemeCustomization.md
    - CSG Server: tutorial/CSGServer.md
    - Where Are My Files: tutorial/where-are-my-files.md
